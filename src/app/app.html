<header class="header">
  <a class="logo" routerLink="/">{{ 'common.appName' | transloco }}</a>

  <div class="tools">
    <select
      class="language"
      [attr.aria-label]="'common.language' | transloco"
      (change)="onLanguageChange($event)"
    >
      @for (code of languages.available; track code) {
        <option [value]="code" [selected]="code === languages.language()">
          {{ languageName(code) }}
        </option>
      }
    </select>

    @if (auth.user()) {
      <a class="link" routerLink="/profile">{{ 'common.profile' | transloco }}</a>
    }
  </div>
</header>

<main class="main">
  <router-outlet />
</main>
