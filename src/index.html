<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TripKitty</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      try {
        var theme = localStorage.getItem('tripkitty.theme');
        if (theme && /^[a-z][a-z0-9-]{0,29}$/.test(theme)) {
          document.documentElement.setAttribute('data-theme', theme);
        }
      } catch (error) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
