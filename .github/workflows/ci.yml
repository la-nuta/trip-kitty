name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --watch=false

      - uses: supabase/setup-cli@v3
        with:
          version: 2.122.1
      - run: supabase start
      # `supabase test db` exits 1 when there are no pgTAP files; T011 adds the first one.
      - if: hashFiles('supabase/tests/**/*.sql') != ''
        run: npm run db:test

      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
